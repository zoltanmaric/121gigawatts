name: Hosting configuration
on:
  pull_request:
    paths: ['hosting/**', '.github/workflows/hosting.yml']
  push:
    branches: [master]
    paths: ['hosting/**', '.github/workflows/hosting.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - run: terraform -chdir=hosting/terraform fmt -check
      - run: terraform -chdir=hosting/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=hosting/terraform validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r hosting/ansible/requirements.txt
      - run: ansible-galaxy collection install -r hosting/ansible/requirements.yml
      - run: ansible-playbook -i hosting/ansible/inventory.example.yml hosting/ansible/site.yml --syntax-check
